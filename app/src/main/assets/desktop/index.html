<style nonce="__NONCE__">
/* Messaging's look: ink on paper, Lato, a bold name over a thick rule. Grey only for quiet
   text and hairlines. The phone is black on white because e-ink can do nothing else; a
   computer screen can, so there is a dark theme, chosen under the cog (Auto, Light, Dark). */
@font-face { font-family: "Lato"; src: url("/fonts/lato-regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Lato"; src: url("/fonts/lato-bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
:root, :root[data-theme="light"] {
  --ink: #000; --paper: #fff; --muted: #666; --line: #e5e5e5; --hover: #fafafa; --active: #f0f0f0;
  --warn: #a00; --shadow: rgba(0,0,0,.28); color-scheme: light;
}
:root[data-theme="dark"] {
  --ink: #e6e6e6; --paper: #0d0d0d; --muted: #8c8c8c; --line: #2b2b2b; --hover: #171717; --active: #212121;
  --warn: #e07070; --shadow: rgba(0,0,0,.6); color-scheme: dark;
}
/* Before the script runs, follow the system, so a dark desktop gets no white flash. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --ink: #e6e6e6; --paper: #0d0d0d; --muted: #8c8c8c; --line: #2b2b2b; --hover: #171717; --active: #212121;
    --warn: #e07070; --shadow: rgba(0,0,0,.6); color-scheme: dark;
  }
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid var(--paper); background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 1px solid transparent; border-radius: 4px; padding: 5px 10px; }
button:hover, button:focus-visible { background: var(--active); }
button.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
button.solid:hover { opacity: .8; background: var(--ink); }
button.quiet { color: var(--muted); padding: 3px 7px; font-size: 13px; }
button.quiet:hover { color: var(--ink); }
button.pill { border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 13px; padding: 4px 12px; }
button.pill:hover { background: var(--ink); color: var(--paper); }
button.pill.on { background: var(--ink); color: var(--paper); }
input[type=text], input[type=search], input[type=date], input[type=time], input[type=datetime-local], select, textarea {
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
textarea { resize: vertical; min-height: 220px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: auto 1fr; height: 100%; }
header.top { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 3px solid var(--ink); position: relative; }
header.top h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; width: 190px; }
header.top .search { flex: 1; max-width: 640px; }
#status { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
#status.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin-right: 6px; vertical-align: middle; }
#settingsBtn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; }
#settingsBtn:hover { background: var(--ink); color: var(--paper); }
#settingsPanel { position: absolute; top: 52px; right: 12px; z-index: 40; width: 290px; max-height: 78vh; overflow-y: auto; padding: 6px 0; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-radius: 5px; box-shadow: 0 3px 12px rgba(0,0,0,.2); }
#settingsPanel h3 { margin: 10px 14px 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#settingsPanel .row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
#settingsPanel .row:hover { background: var(--line); }
#settingsPanel .row .label { flex: 1 1 auto; }
#settingsPanel .row .val { font-weight: 700; }
#settingsPanel .row.danger { color: var(--warn); }
#settingsPanel p { margin: 4px 14px 8px; font-size: 12px; color: var(--muted); line-height: 1.45; }
#settingsPanel hr { margin: 6px 0; border: 0; border-top: 1px solid var(--line); }

.side { padding: 12px 8px; overflow-y: auto; border-right: 1px solid var(--line); }
.side button { display: block; width: 100%; text-align: left; border-radius: 4px; padding: 8px 12px; }
.side button.on { background: var(--active); font-weight: 700; }
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 12px 4px; font-weight: 700; }
.side .count { float: right; color: var(--muted); font-weight: 400; }
main { overflow-y: auto; padding: 18px 24px 60px; }
.composer { max-width: 620px; margin: 0 auto 26px; display: flex; gap: 8px; align-items: stretch; }
.composer .ghost { flex: 1; text-align: left; color: var(--muted); background: var(--paper); border: 1px solid var(--ink); border-radius: 4px; padding: 11px 14px; }
.composer .ghost:hover { background: var(--hover); }
.composer button.act { border: 1px solid var(--ink); border-radius: 4px; padding: 0 14px; }
h3.sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 10px; font-weight: 700; }
.grid { column-width: 250px; column-gap: 14px; }
.card { break-inside: avoid; display: inline-block; width: 100%; margin: 0 0 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 8px; cursor: default; }
.card:hover, .card:focus-within { border-color: var(--ink); }
.card h4 { margin: 0 0 6px; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.card .line { margin: 2px 0; overflow-wrap: anywhere; }
.card .line.head { font-weight: 700; }
.card .more { color: var(--muted); font-size: 13px; margin: 4px 0; }
.card label.item { display: flex; gap: 8px; align-items: flex-start; margin: 3px 0; overflow-wrap: anywhere; cursor: pointer; }
.card label.item input { margin-top: 4px; flex: none; accent-color: var(--ink); }
.card label.item.done span { text-decoration: line-through; color: var(--muted); }
.card .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px; color: var(--muted); }
button.chip { border-color: var(--ink); color: var(--ink); background: var(--paper); }
button.chip:hover { background: var(--ink); color: var(--paper); }
.voice { margin: 8px 0; }
.voice audio { width: 100%; display: block; }
.scan { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.sharebox { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
.sharebox h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 0; }
.share-row { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
.share-row .who { flex: 1; overflow-wrap: anywhere; }
.share-row .canedit { font-size: 13px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.share-row input { accent-color: var(--ink); }
button.armed { color: var(--warn); font-weight: 700; }
.card .acts { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px -6px 0; opacity: 0; }
.card .acts.shown { opacity: 1; }
.card:hover .acts, .card:focus-within .acts { opacity: 1; }
.card img { max-width: 100%; border-radius: 4px; margin: 6px 0; display: block; }
.card .add { margin: 4px 0 2px; }
.card .add input { border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; background: none; padding: 4px 2px; font-size: 14px; }
.empty { text-align: center; color: var(--muted); margin: 60px 0; }

.tasklist { max-width: 760px; margin: 0 auto 30px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px 14px; }
.tasklist h3 { margin: 10px 0 8px; font-size: 17px; font-weight: 700; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
.task:first-of-type { border-top: 0; }
.task input { margin-top: 5px; flex: none; accent-color: var(--ink); }
.task .what { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
.task .what small { display: block; color: var(--muted); }
.task.done .what b { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.addtask { display: flex; gap: 8px; margin: 8px 0 4px; }
.addtask input[type=date] { width: 150px; } .addtask input[type=time] { width: 120px; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; z-index: 50; }
.modal { background: var(--paper); border: 1px solid var(--ink); border-radius: 6px; width: 100%; max-width: 640px; padding: 16px 18px 12px; box-shadow: 0 3px 12px var(--shadow); }
.modal .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.modal .row > label { color: var(--muted); font-size: 13px; min-width: 70px; }
.modal .row > input, .modal .row > select { flex: 1; min-width: 120px; width: auto; }
.modal .bar { display: flex; gap: 6px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.modal .bar .grow { flex: 1; }
.modal .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.modal input.title { font-weight: 700; margin-bottom: 8px; }
.modal img.pic { max-width: 100%; border-radius: 4px; margin: 6px 0; display: block; }
.note { color: var(--warn); font-size: 13px; margin: 6px 0; }
.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 4px; z-index: 90; max-width: 80vw; }
.pair { max-width: 380px; margin: 16vh auto; padding: 0 20px; text-align: center; }
.pair h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; padding-bottom: 10px; border-bottom: 3px solid var(--ink); }
.pair input { font-size: 22px; letter-spacing: .25em; text-align: center; margin: 14px 0 10px; }
.pair button.solid { width: 100%; padding: 9px; }

<body>
<div id="root"></div>
<script nonce="__NONCE__">
"use strict";
(function () {
  var LS = (function () {
    try { localStorage.setItem("n.t", "1"); localStorage.removeItem("n.t"); return localStorage; } catch (e) { return null; }
  })();
  function store(k, v) { try { if (LS) { if (v === null) LS.removeItem(k); else LS.setItem(k, v); } } catch (e) {} }
  function recall(k) { try { return LS ? LS.getItem(k) : null; } catch (e) { return null; } }

  var S = {
    token: recall("notes.token"), notes: [], trash: [], trashDays: 7, folders: [], taskLists: [], newFolder: "", ready: true, etag: null,
    view: "notes", folder: null, query: "", live: false, loaded: false, openNote: null, openTask: null, pending: 0
  };
  var root = document.getElementById("root");

  // ---------------------------------------------------------------- helpers
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v === undefined || v === null || v === false) continue;
      if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k in el && k !== "list") el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  var toastTimer = null;
  function toast(msg) {
    var old = document.getElementById("toast"); if (old) old.remove();
    var t = h("div", { id: "toast", class: "toast", role: "status", text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 5200);
  }

  // ---------------------------------------------------------------- talking to the phone
  function api(method, path, body) {
    var opts = { method: method, cache: "no-store", headers: { "Authorization": "Bearer " + S.token } };
    if (method === "POST") { opts.headers["X-Notes"] = "1"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body || {}); }
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { signOut(); throw new Error("signed out"); }
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ("error " + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function signOut() { var had = !!S.token; S.token = null; store("notes.token", null); closeSocket(); S.wasSignedOut = had; draw(); }

  function load(force) {
    if (!S.token) return Promise.resolve();
    var headers = { "Authorization": "Bearer " + S.token };
    if (S.etag && !force) headers["If-None-Match"] = S.etag;
    return fetch("/api/state", { cache: "no-store", headers: headers }).then(function (r) {
      if (r.status === 304) return null;
      if (r.status === 401) { signOut(); return null; }
      if (!r.ok) throw new Error("the phone answered " + r.status);
      S.etag = r.headers.get("ETag"); if (S.unreachable) { S.unreachable = false; showStatus(); }
      return r.json();
    }).then(function (j) {
      if (!j) return;
      S.notes = j.notes; S.trash = j.trash || []; S.trashDays = j.trashDays || 7; S.folders = j.folders; S.taskLists = j.taskLists; S.newFolder = j.newFolder; S.ready = j.ready; S.loaded = true;
      S.defaultTaskList = j.defaultTaskList; S.sharing = !!j.sharing;
      draw();
      if (modal && modal.noteChanged) modal.noteChanged();
    }).catch(function (e) { S.unreachable = true; showStatus(); if (S.loaded) toast("Cannot reach the phone. " + e.message); });
  }
  var loadTimer = null;
  function loadSoon() { clearTimeout(loadTimer); loadTimer = setTimeout(function () { load(); }, 150); }

  // live: a WebSocket, and a slow poll that only matters when it is down
  var sock = null, retry = null, poll = null;
  function closeSocket() { clearTimeout(retry); clearInterval(poll); if (sock) { try { sock.onclose = null; sock.close(); } catch (e) {} } sock = null; S.live = false; }
  function connect() {
    if (!S.token) return;
    closeSocket();
    poll = setInterval(function () { if (!S.live) load(); }, 10000);
    try {
      sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?token=" + encodeURIComponent(S.token));
    } catch (e) { return; }
    sock.onopen = function () { S.live = true; S.unreachable = false; showStatus(); load(true); };
    sock.onmessage = function (m) { try { if (JSON.parse(m.data).type === "changed") loadSoon(); } catch (e) {} };
    sock.onclose = function () { S.live = false; S.everClosed = true; showStatus(); retry = setTimeout(connect, 3000); };
    sock.onerror = function () { };
  }
  // The connection in words, as Messaging says it: "connecting…", "live", or what went wrong.
  function showStatus() {
    var d = document.getElementById("status"); if (!d) return;

      S.notes = S.notes.filter(function (x) { return x.id !== n.id; }); S.trash = j.trash || S.trash; S.etag = null; closeModal(); redraw();
      toast("Moved to the trash. It is kept " + S.trashDays + " days.");
    }, function (e) { if (e.status === 409) load(true); });
  }

  // ---------------------------------------------------------------- the trash
  function whenText(ms) { try { return new Date(ms).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return new Date(ms).toISOString(); } }
  function trashView() {
    var box = h("div", null);
    box.appendChild(h("p", { class: "hint", text: "Deleted notes are kept " + S.trashDays + " days on the phone, then removed for good." }));
    if (!S.trash.length) { box.appendChild(h("p", { class: "empty", text: "The trash is empty." })); return box; }
    box.appendChild(h("div", { class: "composer" },
      h("button", { class: "act", text: "Empty trash (" + S.trash.length + ")", onclick: emptyTrash })));
    box.appendChild(h("div", { class: "grid" }, S.trash.map(trashCard)));
    return box;
  }
  function trashCard(t) {
    var c = h("article", { class: "card" });
    c.appendChild(h("h4", { text: t.title || "Untitled" }));
    var chips = h("div", { class: "chips" }, h("span", { class: "chip", text: "Deleted " + whenText(t.deleted) }));
    if (t.archived) chips.appendChild(h("span", { class: "chip", text: "Archive" }));
    if (t.folder) chips.appendChild(h("span", { class: "chip", text: t.folder }));
    c.appendChild(chips);
    c.appendChild(h("div", { class: "acts shown" },
      h("button", { class: "quiet", text: "Restore", onclick: function () {
        act(api("POST", "/api/trash/restore", { id: t.id }), function (j) {
          S.trash = j.trash || []; replaceNote(j.note); redraw(); toast("Put back.");
        }, function () { load(true); });
      } }),
      h("button", { class: "quiet", text: "Delete forever", onclick: function () {
        if (!confirm("Delete “" + (t.title || "this note") + "” for good? It cannot be brought back.")) return;
        act(api("POST", "/api/trash/delete", { id: t.id }), function (j) { S.trash = j.trash || []; S.etag = null; redraw(); toast("Deleted for good."); }, function () { load(true); });
      } })));
    return c;
  }
  function emptyTrash() {
    var n = S.trash.length; if (!n) return;
    if (!confirm("Delete all " + n + " note" + (n === 1 ? "" : "s") + " in the trash for good? They cannot be brought back.")) return;
    act(api("POST", "/api/trash/empty", {}), function (j) { S.trash = j.trash || []; S.etag = null; redraw(); toast("Trash emptied."); }, function () { load(true); });
  }

  // ---------------------------------------------------------------- the note editor
  var modal = null;
  function closeModal() { if (modal) { modal.remove(); modal = null; } S.openNote = null; S.openTask = null; }

  function editNote(n, asList) {
    closeModal();
    var isNew = !n;
    var base = n ? { id: n.id, v: n.v, text: n.body, title: n.title } : null;
    S.openNote = n ? n.id : "new";
    var title = h("input", { type: "text", class: "title", placeholder: "Title", value: n ? n.title : "", maxLength: 120, "aria-label": "Title" });
    var body = h("textarea", { "aria-label": "Note", value: n ? n.body : (asList ? "- [ ] " : ""), placeholder: "Take a note…" });
    var rem = h("input", { type: "datetime-local", value: n && n.reminder ? n.reminder.replace(" ", "T") : "" });
    var folder = h("select", null, h("option", { value: "", text: "Top level" }));
    var fl = S.folders.slice(); if (isNew && S.newFolder && fl.indexOf(S.newFolder) < 0) fl.push(S.newFolder);
    fl.forEach(function (f) { folder.appendChild(h("option", { value: f, text: f })); });
    folder.value = isNew ? S.newFolder : (n.folder || "");
    var warn = h("div", { class: "note", hidden: true });
    var original = { title: title.value, body: body.value, rem: rem.value };

    function dirty() { return title.value !== original.title || body.value !== original.body || rem.value !== original.rem; }
    function save(thenClose) {
      if (!dirty() && !isNew) { if (thenClose) closeModal(); return Promise.resolve(); }
      if (isNew && !title.value.trim() && !body.value.trim()) { closeModal(); return Promise.resolve(); }
      var reminder = rem.value ? rem.value.replace("T", " ").slice(0, 16) : "";
      var req = isNew
        ? api("POST", "/api/notes/create", { title: title.value, text: body.value, folder: folder.value, reminder: reminder || null })
        : api("POST", "/api/notes/update", { id: base.id, v: base.v, baseText: base.text, title: title.value, text: body.value, reminder: reminder || null });
      return act(req, function (j) {
        replaceNote(j.note, isNew ? undefined : base.id);
        if (j.conflict === "kept-both") toast("This note was also edited on the phone. Both versions are kept: the phone's is at the end under “Edited elsewhere”.");
        else if (j.conflict === "merged") toast("This note was also edited on the phone. The two edits were joined.");
        if (thenClose) { closeModal(); redraw(); }
        else { base = { id: j.note.id, v: j.note.v, text: j.note.body, title: j.note.title }; original = { title: title.value, body: body.value, rem: rem.value }; redraw(); }
      }, function () { });
    }
    function close() { save(true).then(function () { }); }
    var toggleList = h("button", { text: "List on/off", title: "Turn the lines into a checklist, or back", onclick: function () {
      var ls = body.value.split("\n"), allTasks = ls.filter(function (l) { return l.trim(); }).every(function (l) { return TASK.test(l); });
      body.value = ls.map(function (l) {
        if (!l.trim()) return l;
        if (allTasks) { var m = TASK.exec(l); return m[1] + m[3]; }
        return TASK.test(l) ? l : l.replace(/^(\s*)([-*+] )?/, "$1- [ ] ");
      }).join("\n");
    } });
    var addItem = h("button", { text: "Add item", onclick: function () { body.value = body.value.replace(/\n*$/, "\n") + "- [ ] "; body.focus(); body.setSelectionRange(body.value.length, body.value.length); } });
    var pinBtn = n && !n.archived ? h("button", { text: n.pinned ? "Unpin" : "Pin", onclick: function () { act(api("POST", "/api/notes/pin", { id: n.id, pinned: !n.pinned }), function (j) { replaceNote(j.note); n = j.note; this.textContent = n.pinned ? "Unpin" : "Pin"; redraw(); }.bind(this)); } }) : null;
    var archBtn = n ? h("button", { text: n.archived ? "Restore" : "Archive", onclick: function () { save(false).then(function () { return act(api("POST", "/api/notes/archive", { id: base.id, archived: !n.archived }), function (j) { replaceNote(j.note, j.was); closeModal(); redraw(); }); }); } }) : null;
    var delBtn = n ? h("button", { text: "Delete", onclick: function () { removeNote(n); } }) : null;
    var shareBox = h("div", { class: "sharebox", hidden: true });
    var shareBtn = n && S.sharing ? h("button", { text: "Share", "aria-expanded": "false", onclick: function () {
      shareBox.hidden = !shareBox.hidden; this.setAttribute("aria-expanded", String(!shareBox.hidden));
      if (!shareBox.hidden) loadShares(n, shareBox);
    } }) : null;

    var pics = h("div", null);
    if (n) n.pictures.forEach(function (p) { var img = h("img", { alt: "", class: "pic" }); picture(n, p, img); pics.appendChild(img); });
    if (n) n.recordings.forEach(function (r) { pics.appendChild(player(n, r, false)); });
    if (n) n.scans.forEach(function (r) { pics.appendChild(scanRow(n, r)); });

    var m = h("div", { class: "modal", role: "dialog", "aria-label": "Note" },
      warn, title, body,
      pics,
      h("div", { class: "hint", text: "A line starting “- [ ] ” is a checklist item. Put “⏰ 2026-10-08 17:00” at the end of an item for a reminder on that item." }),
      h("div", { class: "row" }, h("label", { text: "Reminder" }), rem, h("button", { class: "quiet", text: "Clear", onclick: function () { rem.value = ""; } })),
      h("div", { class: "row" }, h("label", { text: "Folder" }), isNew ? folder : h("span", { text: n.folder || "Top level" })),
      h("div", { class: "bar" }, toggleList, addItem, pinBtn, shareBtn, archBtn, delBtn, h("span", { class: "grow" }),
        h("button", { text: "Close", onclick: close }), h("button", { class: "solid", text: "Save", onclick: function () { save(true); } })),
      shareBox);
    var scrim = h("div", { class: "scrim" }, m);
    scrim.addEventListener("mousedown", function (e) { if (e.target === scrim) close(); });
    scrim.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") save(true);
    });
    modal = scrim; document.body.appendChild(scrim);
    (isNew ? (asList ? body : title) : body).focus();
    // If the phone changes this note while it is open, say so; the save then joins the two.
    scrim.noteChanged = function () {
      var now = n && noteById(base.id);
      if (now && now.v !== base.v) { warn.hidden = false; warn.textContent = "This note changed on the phone while it was open. Saving will keep both versions."; }
    };
  }

  // ---------------------------------------------------------------- sharing (Nextcloud's own, through the phone)
  // Who a note is shared with, can-edit, stop, and who else it could be shared with: the phone's
  // Share screen. The phone syncs the note first, so this can take a few seconds.
  function loadShares(n, box) {
    box.replaceChildren(h("p", { class: "hint", text: "Asking Nextcloud…" }));
    api("GET", "/api/shares?id=" + encodeURIComponent(n.id)).then(function (j) { drawShares(n, box, j); })
      .catch(function (e) { if (e.message !== "signed out") box.replaceChildren(h("p", { class: "note", text: e.message })); });
  }
  function shareAct(n, box, path, body) {
    box.querySelectorAll("button, input").forEach(function (b) { b.disabled = true; });
    body.id = n.id;
    return api("POST", path, body).then(function (j) { drawShares(n, box, j); loadSoon(); })
      .catch(function (e) { if (e.message !== "signed out") { toast(e.message); loadShares(n, box); } });
  }
  function drawShares(n, box, j) {
    box.textContent = "";
    if (!j.available) { box.appendChild(h("p", { class: "hint", text: "Sharing needs the notes kept on Nextcloud." })); return; }
    box.appendChild(h("h3", { text: "Sharing" }));
    if (j.sharedWithMe) box.appendChild(h("p", { class: "hint", text: "Shared with you by " + (j.from || "someone") + "." }));
    if (j.shares.length) {
      box.appendChild(h("div", { class: "hint", text: "Shared with" }));
      j.shares.forEach(function (sh) {
        var edit = h("input", { type: "checkbox", checked: sh.canEdit, "aria-label": "Can edit" });
        edit.addEventListener("change", function () { shareAct(n, box, "/api/shares/edit", { share: sh.id, canEdit: edit.checked }); });
        var armed = false, timer = null;
        var stop = h("button", { class: "quiet", text: "Stop sharing", onclick: function () {
          if (!armed) { armed = true; stop.textContent = "Tap again to stop"; stop.classList.add("armed"); timer = setTimeout(function () { armed = false; stop.textContent = "Stop sharing"; stop.classList.remove("armed"); }, 6000); return; }
          clearTimeout(timer); shareAct(n, box, "/api/shares/stop", { share: sh.id });
        } });
        box.appendChild(h("div", { class: "share-row" }, h("span", { class: "who", text: sh.name }), h("label", { class: "canedit" }, edit, " Can edit"), stop));
      });
    } else if (!j.sharedWithMe) {
      box.appendChild(h("p", { class: "hint", text: "Not shared with anyone." }));
    }
    if (j.people.length) {
      box.appendChild(h("div", { class: "hint", text: "Share with" }));
      j.people.forEach(function (p) {
        box.appendChild(h("div", { class: "share-row" }, h("span", { class: "who", text: p.name }),
          h("button", { class: "pill", text: "Share", title: "They can read it and change it; untick Can edit to make it read-only.", onclick: function () { shareAct(n, box, "/api/shares/add", { person: p.id, canEdit: true }); } })));
      });
    }
    box.appendChild(h("p", { class: "hint", text: "Their phone syncs the same note, so a list ticked in one place is ticked in the other." }));
  }

  // ---------------------------------------------------------------- tasks
  function dueWords(due) { return due ? due.replace("T", " ") : ""; }
  var PRI = { 0: "", 1: "High", 5: "Medium", 9: "Low" };
  function priWord(p) { return p === 0 ? "" : p <= 4 ? "High" : p === 5 ? "Medium" : "Low"; }

  function tasksView() {
    var wrap = h("div", null);
    if (!S.taskLists.length) wrap.appendChild(h("p", { class: "empty", text: "No task lists yet." }));
    S.taskLists.forEach(function (l) {
      var open = l.items.filter(function (i) { return !i.done; }).sort(function (a, b) { return (a.due || "￿") < (b.due || "￿") ? -1 : 1; });
      var done = l.items.filter(function (i) { return i.done; });
      var box = h("section", { class: "tasklist" }, h("h3", { text: l.name + (l.readOnly ? " (read only)" : "") + (l.onPhone ? "" : "") }));
      if (!l.readOnly) {
        var t = h("input", { type: "text", placeholder: "Add a task", maxLength: 500, "aria-label": "New task in " + l.name });
        var d = h("input", { type: "date", "aria-label": "Due day" }), tm = h("input", { type: "time", "aria-label": "Due time" });
        var go = function () {
          if (!t.value.trim()) return;
          var due = d.value ? (tm.value ? d.value + "T" + tm.value : d.value) : null;
          act(api("POST", "/api/tasks/add", { list: l.id, summary: t.value, due: due }), function () { t.value = ""; d.value = ""; tm.value = ""; load(true); });
        };
        t.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
        box.appendChild(h("div", { class: "addtask" }, t, d, tm, h("button", { class: "solid", text: "Add", onclick: go })));
      }
      open.forEach(function (i) { box.appendChild(taskRow(l, i)); });
      if (done.length) {
        var shown = h("div", { hidden: true }, done.map(function (i) { return taskRow(l, i); }));
        box.appendChild(h("button", { class: "quiet", text: "Completed (" + done.length + ")", onclick: function () { shown.hidden = !shown.hidden; } }));
        box.appendChild(shown);
      }
      wrap.appendChild(box);
    });
    return wrap;
  }
  function taskRow(l, i) {
    var box = h("input", { type: "checkbox", checked: i.done, disabled: l.readOnly, "aria-label": i.summary });
    box.addEventListener("change", function () { act(api("POST", "/api/tasks/tick", { list: l.id, name: i.name }), function () { load(true); }, function () { load(true); }); });
    var bits = [];
    if (i.due) bits.push("Due " + dueWords(i.due));
    if (i.priority) bits.push(priWord(i.priority) + " priority");
    if (i.repeats) bits.push("Repeats");
    if (i.rings) bits.push("Rings on the phone");
    var what = h("div", { class: "what" }, h("b", { text: i.summary || "(no title)" }), bits.length ? h("small", { text: bits.join(" · ") }) : null, i.description ? h("small", { text: i.description.length > 160 ? i.description.slice(0, 160) + "…" : i.description }) : null);
    if (!l.readOnly) what.addEventListener("click", function () { editTask(l, i); });
    return h("div", { class: "task" + (i.done ? " done" : "") }, box, what,
      l.readOnly ? null : h("button", { class: "quiet", text: "Delete", onclick: function () { if (confirm("Delete this task?")) act(api("POST", "/api/tasks/delete", { list: l.id, name: i.name }), function () { load(true); }); } }));
  }
  function editTask(l, i) {
    closeModal();
    var summary = h("input", { type: "text", value: i.summary, maxLength: 500, "aria-label": "Task" });
    var desc = h("textarea", { value: i.description, "aria-label": "Notes" });
    var dd = i.due ? i.due.slice(0, 10) : "", tt = i.due && i.due.length > 10 ? i.due.slice(11) : "";
    var day = h("input", { type: "date", value: dd }), time = h("input", { type: "time", value: tt });
    var pri = h("select", null, [[0, "None"], [9, "Low"], [5, "Medium"], [1, "High"]].map(function (p) { return h("option", { value: String(p[0]), text: p[1] }); }));
    pri.value = String(i.priority === 0 ? 0 : i.priority <= 4 ? 1 : i.priority === 5 ? 5 : 9);
    var rings = h("input", { type: "checkbox", checked: i.rings });
    var from = { summary: i.summary, description: i.description, due: i.due, priority: i.priority, done: i.done };
    function save() {
      var due = day.value ? (time.value ? day.value + "T" + time.value : day.value) : null;
      var to = { summary: summary.value, description: desc.value, due: due, priority: parseInt(pri.value, 10) };
      if (pri.value === String(from.priority === 0 ? 0 : from.priority <= 4 ? 1 : from.priority === 5 ? 5 : 9)) to.priority = from.priority;
      act(api("POST", "/api/tasks/update", { list: l.id, name: i.name, from: from, to: to, rings: rings.checked }), function () { closeModal(); load(true); });
    }
    var m = h("div", { class: "modal", role: "dialog", "aria-label": "Task" },
      h("div", { class: "title", text: "Task in " + l.name }), summary, h("div", { class: "row" }, desc),
      h("div", { class: "row" }, h("label", { text: "Due" }), day, time, h("button", { class: "quiet", text: "Clear", onclick: function () { day.value = ""; time.value = ""; } })),
      h("div", { class: "row" }, h("label", { text: "Priority" }), pri),
      h("div", { class: "row" }, h("label", { text: "Rings" }), rings, h("span", { class: "hint", text: "Ring on the phone when it is due (needs a time)." })),
      i.repeats ? h("div", { class: "hint", text: "It repeats. Ticking it moves it on to the next time." }) : null,
      h("div", { class: "bar" }, h("span", { class: "grow" }), h("button", { text: "Close", onclick: closeModal }), h("button", { class: "solid", text: "Save", onclick: save })));
    var scrim = h("div", { class: "scrim" }, m);
    scrim.addEventListener("mousedown", function (e) { if (e.target === scrim) closeModal(); });
    scrim.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); if ((e.ctrlKey || e.metaKey) && e.key === "Enter") save(); });
    modal = scrim; document.body.appendChild(scrim); summary.focus();
  }

  // ---------------------------------------------------------------- start
  applyTheme();

  draw();
  if (S.token) { load(true); connect(); }
})();
</script>
</body>
</html>
